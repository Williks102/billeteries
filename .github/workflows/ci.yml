name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule les exécutions obsolètes d'une même branche (économise les minutes gratuites)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Bloquant : structure des routes, sans base de données ----
  routes:
    name: Routes (convention ressource)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip, xml, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Préparer l'environnement
        run: |
          printf 'APP_ENV=testing\nAPP_KEY=base64:%s\nPAIEMENTPRO_MERCHANT_ID=TEST\n' "$(php -r 'echo base64_encode(random_bytes(32));')" > .env
      - name: Tests de structure des routes
        run: vendor/bin/phpunit tests/Feature/RoutingConventionsTest.php

  # ---- Non bloquant pour l'instant : suite complète sur MySQL ----
  # Passer `continue-on-error` à false quand les migrations tournent sur MySQL
  # et que les tests de caractérisation (paiement, stock) existent.
  full-suite:
    name: Suite complète (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: billetterie_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: billetterie_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip, xml, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Préparer l'environnement
        run: |
          printf 'APP_ENV=testing\nAPP_KEY=base64:%s\nPAIEMENTPRO_MERCHANT_ID=TEST\n' "$(php -r 'echo base64_encode(random_bytes(32));')" > .env
      - name: Migrations
        run: php artisan migrate --force
      - name: Tests
        run: vendor/bin/phpunit

  # ---- Avertissement seulement : le code existant a ~120 écarts de style ----
  style:
    name: Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
