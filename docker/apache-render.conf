# Offre gratuite Render : 512 Mo de RAM. Peu de workers pour éviter l'arrêt par manque de mémoire.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 10
    MaxConnectionsPerChild 500
</IfModule>

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off
