# Offre gratuite Render : 512 Mo de RAM. Peu de workers pour éviter l'arrêt par manque de mémoire.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 10
    MaxConnectionsPerChild 500
</IfModule>

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off

# --- Durcissement (F2 / F3) ---

# F3 : les fichiers statiques servis directement par Apache (public/build, public/css, public/js, images) ne passent
# pas par le middleware SecurityHeaders de Laravel : on ajoute les mêmes en-têtes essentiels. `setIfEmpty` évite les
# doublons si une réponse PHP les a déjà posés. Render termine le HTTPS devant le conteneur.
<IfModule mod_headers.c>
    <FilesMatch "\.(css|js|mjs|map|json|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|txt)$">
        Header always setIfEmpty X-Content-Type-Options "nosniff"
        Header always setIfEmpty Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </FilesMatch>
</IfModule>

# F2 : jamais d'exécution de PHP dans les fichiers téléversés (public/storage -> storage/app/public). La validation
# des téléversements reste la première barrière ; ceci est une défense en profondeur. <Directory> doit citer le
# chemin tel que visité par Apache : on couvre le lien public/storage ET sa cible.
<Directory /var/www/html/public/storage>
    <FilesMatch "\.(php[0-9]?|phtml|pht|phar)$">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
</Directory>
<Directory /var/www/html/storage/app/public>
    <FilesMatch "\.(php[0-9]?|phtml|pht|phar)$">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
</Directory>

# F2 : fonctions PHP dangereuses désactivées pour les requêtes WEB uniquement (mod_php). Les commandes Artisan
# (CLI : migrate, schedule:work qui lance des sous-processus via proc_open) ne sont pas concernées. `exec` reste
# autorisée : Admin\SettingsController::backup l'utilise (voir docs/agents/reports/devops-audit-migrations.md).
<IfModule mod_php.c>
    php_admin_value disable_functions "shell_exec,passthru,system,popen,proc_open,pcntl_exec,show_source,dl"
</IfModule>
