expose_php=Off
memory_limit=256M
upload_max_filesize=10M
post_max_size=12M
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
# Fonctions de shell inutiles au projet (git grep app/ : seule exec() est utilisée, par Admin\SettingsController::backup ;
# vendor : DomPDF, simple-qrcode et le mailer n'en ont pas besoin ; ramsey/uuid et monolog testent la disponibilité).
# NON désactivées : exec (backup admin) et proc_open (schedule:work, Symfony Process, en CLI). php.ini s'applique aussi
# au CLI : disable_functions est une directive PHP_INI_SYSTEM, inopérante dans la configuration Apache.
disable_functions=shell_exec,passthru,system,popen,pcntl_exec,show_source,dl
